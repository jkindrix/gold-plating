name: check external links

# Scheduled and manual only — deliberately OFF the required-check path. A
# publisher's transient outage should not block an editorial pull request, so
# link rot surfaces as a weekly report instead of a merge gate.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Check external links in entries
        run: python3 scripts/check-links.py
